name: Android CI & Release Builder

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release
      build_bundle:
        description: 'Build Android App Bundle (AAB) for Play Store'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Debug APK
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore and Environment
        run: |
          # If debug.keystore.base64 exists and debug.keystore does not, decode it
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Create empty or template secrets if not present
          touch secrets.properties
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug -Dkotlin.compiler.execution.strategy=daemon -Dksp.useKSP2=true --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-release:
    name: Build Release APK & AAB
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Key & Environment
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Check for debug keystore
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Prepare release keystore: if secret provided decode it, otherwise generate release keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET:-android}" >> $GITHUB_ENV
          else
            echo "Generating CI release signing key..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=WinDroid Release,O=WinDroid,C=US"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV

          # Prepare secrets config
          touch secrets.properties
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Release APK
        run: |
          gradle assembleRelease -Dkotlin.compiler.execution.strategy=daemon -Dksp.useKSP2=true --stacktrace

      - name: Build Release AAB (Bundle)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_bundle == 'true' || github.event.inputs.build_bundle == true }}
        run: |
          gradle bundleRelease -Dkotlin.compiler.execution.strategy=daemon -Dksp.useKSP2=true --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windroid-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_bundle == 'true' || github.event.inputs.build_bundle == true }}
        uses: actions/upload-artifact@v4
        with:
          name: windroid-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
